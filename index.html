<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Phathu Quote Studio 2.0</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Cinzel:wght@400;700&family=Lora:wght@400;700&family=Montserrat:wght@400;700&family=Oswald:wght@400;700&family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400;600;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body>

<h1>Phathu Quote Studio 2.0</h1>

<!-- Upload Image -->

<input
type="file"
id="imageInput"
accept="image/*">

<!-- Quote -->

<textarea
id="quoteInput"
placeholder="Write your quote here..."></textarea>

<!-- Signature -->

<input
type="text"
id="signatureInput"
placeholder="Signature"
value="Phathu Mbedzi">

<!-- Canvas -->

<div id="editor">

<img id="photo">

<div id="overlay"></div>

<div id="quoteBox">

<span id="quote"></span>

</div>

<div id="signature">

Phathu Mbedzi

</div>

</div>

<!-- Controls -->

<div id="controls">

<button id="createBtn">
Create Design
</button>

<button id="saveBtn">
Save Image
</button>

<button id="videoBtn">
Create Video
</button>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script src="script.js"></script>

</body>

</html>
