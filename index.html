<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Phathu Quote Studio</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#111;
font-family:Arial,sans-serif;
color:white;
text-align:center;
padding:20px;
}

h1{
margin-bottom:20px;
font-size:35px;
}

input,
textarea,
select,
button{

widt:90%;
max-width:500px;
padding:12px;
margin:10px auto;
display:block;
border:none;
border-radius:12px;
font-size:16px;

}

textarea{
height:120px;
resize:none;
}

button{
background:white;
color:black;
font-weight:bold;
cursor:pointer;
transition:.3s;
}

button:hover{
background:#ddd;
}

label{
display:block;
margin-top:15px;
font-size:18px;
}
/* ========================= */
/* CANVAS */
/* ========================= */

#canvasArea{

width:350px;
height:450px;
margin:25px auto;
position:relative;
overflow:hidden;
border-radius:20px;
background:#222;
box-shadow:0 0 25px rgba(255,255,255,.15);
transition:0.4s;

}

/* Full Screen Mode */

#canvasArea.fullscreen{

width:400vw;
height:400vh;
margin:0;
border-radius:0;
box-shadow:none;

}

#photo{

width:100%;
height:100%;
object-fit:cover;

}

#filter{

position:absolute;
top:0;
left:0;
width:100%;
height:100%;

}

#quote{

position:absolute;
left:25px;
right:25px;
bottom:95px;
font-size:30px;
font-weight:bold;
color:white;
line-height:1.3;

text-shadow:
2px 2px 10px black,
0px 0px 15px black;

}

#signature{

position:absolute;
bottom:35px;
right:20px;

font-size:18px;
font-style:italic;
color:white;

text-shadow:
2px 2px 8px black;

}

/* FILTERS */

.none{
background:transparent;
}

.dark{
background:rgba(0,0,0,.55);
}

.gold{
background:rgba(90,60,0,.45);
}

.blue{
background:rgba(0,40,120,.45);
}

.clean{
background:rgba(255,255,255,.20);
}

</style>

</head>
<body>

<h1>Phathu Quote Studio</h1>

<input
type="file"
id="upload"
accept="image/*">

<textarea id="quoteInput">The greatest investment you can make is yourself.</textarea>

<select id="style">

<option value="none">No Filter</option>

<option value="dark">Investor Black</option>

<option value="gold">Luxury Gold</option>

<option value="blue">Trading Blue</option>

<option value="clean">Education Clean</option>

</select>

<label>Caption Size</label>

<input
type="range"
id="size"
min="15"
max="60"
value="30">

<input
type="text"
id="signatureInput"
value="Phathu Mbedzi">

<button onclick="createDesign()">
Create Design
</button>

<button onclick="toggleFullScreen()">
Full Screen
</button>

<button onclick="saveImage()">
Save Image
</button>

<div id="canvasArea">

<img id="photo">

<div id="filter" class="none"></div>

<div id="quote">
The greatest investment you can make is yourself.
</div>

<div id="signature">
— Phathu Mbedzi
</div>

</div>

<script>
  function createDesign(){

const file=document.getElementById("upload").files[0];

if(file){

const reader=new FileReader();

reader.onload=function(e){

document.getElementById("photo").src=e.target.result;

}

reader.readAsDataURL(file);

}

document.getElementById("quote").innerHTML=
document.getElementById("quoteInput").value;

document.getElementById("quote").style.fontSize=
document.getElementById("size").value+"px";

document.getElementById("signature").innerHTML=
"— "+document.getElementById("signatureInput").value;

document.getElementById("filter").className=
document.getElementById("style").value;

}

document.getElementById("size").oninput=function(){

document.getElementById("quote").style.fontSize=
this.value+"px";

}

function toggleFullScreen(){

const canvas=document.getElementById("canvasArea");

canvas.classList.toggle("fullscreen");

}

function saveImage(){

const area=document.getElementById("canvasArea");

html2canvas(area,{
scale:2,
useCORS:true
}).then(function(canvas){

const link=document.createElement("a");

link.download="Phathu_Quote_Studio.png";

link.href=canvas.toDataURL("image/png");

link.click();

});

}

</script>

</body>

</html>
