<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Phathu Quote Studio 2.0</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Cinzel:wght@400;700&family=Lora:wght@400;700&family=Montserrat:wght@400;700&family=Oswald:wght@400;700&family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400;600;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body>

<h1>Phathu Quote Studio 2.0</h1>

<!-- Upload Image -->

<input
type="file"
id="imageInput"
accept="image/*">

<!-- Quote -->

<textarea
id="quoteInput"
placeholder="Write your quote here..."></textarea>

<!-- Signature -->

<input
type="text"
id="signatureInput"
placeholder="Signature"
value="Phathu Mbedzi">

<!-- Canvas -->

<div id="editor">

<img id="photo">

<div id="overlay"></div>

<div id="quoteBox">

<span <div id="quote"></div>

</div>

<div id="signature">

Phathu Mbedzi

</div>

</div>

<!-- Controls -->
<!-- ===========================
TEXT CONTROLS
=========================== -->

<label>Font</label>

<select id="fontSelect">

<option value="Poppins">Poppins</option>

<option value="Anton">Anton</option>

<option value="Bebas Neue">Bebas Neue</option>

<option value="Montserrat">Montserrat</option>

<option value="Oswald">Oswald</option>

<option value="Playfair Display">Playfair Display</option>

<option value="Cinzel">Cinzel</option>

<option value="Lora">Lora</option>

<option value="Roboto">Roboto</option>

</select>

<label>Font Size</label>

<input
type="range"
id="fontSize"
min="18"
max="80"
value="42">

<label>Text Color</label>


<input
type="color"
id="wordColor"
value="#00AEEF">

<button id="applyWordColor">
Apply to Selected Word
</button>

<label>Overlay Darkness</label>

<input
type="range"
id="overlayOpacity"
min="0"
max="80"
value="25">

<label>Background Filter</label>

<select id="filterSelect">

<option value="none">None</option>

<option value="dark">Dark</option>

<option value="gold">Gold</option>

<option value="blue">Blue</option>

<option value="green">Green</option>

<option value="purple">Purple</option>

                               </select>
<div id="controls">

<button id="createBtn">
Create Design
</button>

<button id="saveBtn">
Save Image
</button>

<button id="videoBtn">
Create Video
</button>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script src="script.js"></script>

</body>

</html>
